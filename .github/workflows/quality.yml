name: Calidad del proyecto

on:
  push:
    branches: [main, ingenieria-10-10]
  pull_request:
    branches: [main, ingenieria-10-10]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Revisar, probar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el codigo
        run: npm run lint

      - name: Revisar tipos
        run: npm run typecheck

      - name: Compilar la aplicacion
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test
